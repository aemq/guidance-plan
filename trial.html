  button{font-family:inherit;cursor:pointer;}

  /* ---------- header ---------- */

    color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(10,60,65,0.18);
  }
  header.top .title-row{display:flex; align-items:center; gap:8px;}
  header.top .title-row .emoji{font-size:22px;}
  header.top h1{font-size:16px; margin:0; font-weight:700;}
  header.top .school-line{font-size:11.5px; opacity:.92; margin-top:4px;}
  header.top .school-line input{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff;
    border-radius:8px; padding:4px 8px; font-size:11.5px; width:100%; margin-top:4px;
  }
  header.top .school-line input::placeholder{color:rgba(255,255,255,.7);}
  .counselors-row{display:flex; gap:8px; flex-wrap:wrap;}
  .counselor-chip{
    display:flex; align-items:center; gap:5px; flex:1; min-width:140px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
    border-radius:8px; padding:2px 8px; font-size:11.5px;
  }
  .counselor-chip input{
    background:transparent; border:none; color:#fff; font-size:11.5px; padding:4px 2px; flex:1; min-width:0;
  }
  .counselor-chip input::placeholder{color:rgba(255,255,255,.7);}

  /* tabs */
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:10px 12px 4px; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto; padding:6px 12px; border-radius:20px; font-size:12px; white-space:nowrap;
    background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.28);
  }
  .tab.active{background:#fff; color:var(--teal-900); font-weight:700; border-color:#fff;}
  .tab .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:5px; background:#ffd873;}
  .tab.done .dot{background:#7be0b0;}

  /* ---------- main ---------- */
  main{padding:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(10,60,65,0.05);
  }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--teal-900); display:flex; align-items:center; gap:6px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input[type=text], .field textarea, .field select{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:8px 10px;
    font-size:13.5px; background:#fbfdfd; color:var(--ink);
  }
  .field textarea{min-height:64px; resize:vertical; line-height:1.6;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal-500); outline-offset:1px;}
  .row2{display:flex; gap:8px;}
  .row2 > .field{flex:1;}

  .list-editor{display:flex; flex-direction:column; gap:6px;}
  .list-row{display:flex; gap:6px; align-items:flex-start;}
  .list-row .bullet{color:var(--teal-700); font-size:14px; margin-top:9px;}
  .list-row textarea{flex:1; min-height:40px;}
  .icon-btn{
    flex:0 0 auto; width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--muted); font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.danger{color:var(--danger); border-color:#f0d3dd;}
  .add-line-btn{
    align-self:flex-start; margin-top:2px; font-size:12.5px; color:var(--teal-700); background:none; border:none; font-weight:700;
    padding:4px 2px;
  }

  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    display:flex; align-items:center; gap:5px; background:var(--teal-100); color:var(--teal-900);
    border-radius:20px; padding:5px 10px; font-size:12px; border:1px solid #d7ece9;
  }
  .chip button{background:none;border:none;color:var(--danger);font-size:13px;line-height:1;padding:0;}
  .chip-add{display:flex; gap:6px; margin-top:8px;}
  .chip-add input{flex:1;}

  .status-toggles{display:flex; gap:8px; margin-top:4px;}
  .status-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    border:1.5px solid var(--line); border-radius:10px; padding:9px; font-size:12.5px; background:#fff; color:var(--muted); font-weight:700;
  }
  .status-btn.on{background:#e8f8f0; border-color:#8fdcb2; color:#1a7a4c;}

  /* images */
  .drop-zone{
    border:2px dashed #c7d8d7; border-radius:12px; padding:16px; text-align:center; color:var(--muted);
    font-size:12.5px; background:#fbfdfd;
  }
  .drop-zone.drag{background:var(--teal-100); border-color:var(--teal-500);}
  .img-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .img-cell{position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); aspect-ratio:1/1;}
  .img-cell img{width:100%; height:100%; object-fit:cover; display:block;}
  .img-cell .rm{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; border:none; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .upload-row{display:flex; gap:8px; margin-top:10px;}
  .btn{
    border:none; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn-teal{background:var(--teal-700); color:#fff;}
  .btn-outline{background:#fff; border:1.5px solid var(--teal-700); color:var(--teal-700);}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-danger-outline{background:#fff; border:1.5px solid var(--danger); color:var(--danger);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn-block{width:100%;}

  /* home overview */
  .overview-list{display:flex; flex-direction:column; gap:8px;}
  .overview-row{
    display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line); border-radius:12px; background:#fff;
  }
  .overview-row .badge{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;
  }
  .overview-row .meta{flex:1; min-width:0;}
  .overview-row .meta .t{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .overview-row .meta .d{font-size:11px; color:var(--muted);}
  .overview-row .marks{display:flex; gap:3px; flex:0 0 auto;}
  .mk{width:8px; height:8px; border-radius:50%; background:#e2e2e2;}
  .mk.on{background:#3fbf82;}

  .simple-table{width:100%; border-collapse:collapse; font-size:12px;}
  .simple-table td{padding:7px 4px; border-bottom:1px solid var(--line);}
  .simple-table td:last-child{text-align:left; width:26px;}
  .cb{width:18px; height:18px;}

  /* bottom nav */
  .bottom-nav{
    background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; padding:8px 10px; gap:8px; margin-top:10px;
  }
  .bottom-nav button{flex:1;}
  .export-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .export-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:19px; padding:10px 4px; border-radius:12px;
  }
  .export-btn span{ font-size:10.5px; font-weight:700; }
  .toast{
    margin:0 12px 10px; background:#1e2a2a; color:#fff; text-align:center;
    padding:8px 16px; border-radius:10px; font-size:12.5px; display:none;
  }
  .toast.show{display:block;}
  .modal-overlay{
    background:rgba(10,30,32,.55); display:flex; align-items:flex-end; min-height:400px;
  }
  .modal-sheet{
    background:#fff; width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px;

  .close-x{position:absolute; top:10px; left:10px; background:none; border:none; font-size:20px; color:var(--muted);}

  .empty-hint{font-size:12px; color:var(--muted); text-align:center; padding:6px 0;}

  /* signature pads */
  .sig-block{display:flex; flex-direction:column; gap:14px;}
  .sig-person{border:1px solid var(--line); border-radius:12px; padding:10px;}

  .back-btn{background:none; border:none; color:var(--teal-900); font-size:13px; font-weight:700; padding:4px 2px;}

  /* program row on home */
  .prog-row{
    display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line); border-radius:12px; background:#fff; margin-bottom:8px;

  .prog-row .t{font-size:12.5px; font-weight:700; flex:1;}
  .prog-row .chev{color:var(--muted); font-size:14px;}

  /* ---------------- PRINT REPORT VIEW ---------------- */
  #reportView{display:none;}
  .report-page{padding:16px 6px;}
  .report-header{
    text-align:center; border-bottom:3px solid var(--gold); padding-bottom:10px; margin-bottom:14px;

  .report-header h1{font-size:18px; color:var(--teal-900); margin:4px 0;}
  .report-header .sub{font-size:12px; color:var(--muted);}
  .report-week{
    border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; page-break-inside:avoid;
  }

  .report-week .rw-head .n{font-size:11px; opacity:.9;}
  .report-week .rw-head h3{margin:2px 0 0; font-size:14.5px;}
  .report-week .rw-body{padding:10px 14px; font-size:12px; line-height:1.7;}
  .report-week .rw-body b{color:var(--teal-900);}
  .report-week ul{margin:4px 0; padding-inline-start:18px;}
  .report-imgs{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .report-imgs img{width:90px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
  .report-pdf{margin-top:8px;}
  .report-pdf .cap{font-size:11px; color:var(--muted); margin-bottom:4px;}
  .report-pdf img{display:block; width:100%; max-width:520px; margin:6px auto; border:1px solid var(--line); border-radius:6px; page-break-inside:avoid;}

  /* ---------------- desktop / wide-screen layout ---------------- */
  @media (min-width: 860px){
    body{ font-size:15px; }
    header.top{ padding: 16px 0 10px; }
    header.top .title-row, header.top .school-line, .tabs{ max-width: 760px; margin-inline:auto; padding-inline:20px; }
    header.top .title-row .emoji{ font-size:26px; }
    header.top h1{ font-size:19px; }
    .bottom-nav{ max-width:760px; margin:14px auto 0; border-radius:12px; border:1px solid var(--line); }
    #exportPanel{ max-width:760px; margin:10px auto 0; }
    .toast{ max-width:760px; margin-inline:auto; }
    main{ max-width:760px; margin-inline:auto; padding:18px 20px 40px; }
    .card{ padding:20px 22px; }
    .card h2{ font-size:16.5px; }
    .field input[type=text], .field textarea, .field select{ font-size:14.5px; padding:10px 12px; }
    .sig-block{ flex-direction:row; }
    .sig-person{ flex:1; }
    .prog-row, .overview-row{ padding:12px 14px; }
    .tabs{ flex-wrap:wrap; overflow-x:visible; }
    .tab{ font-size:13px; padding:7px 14px; }
    .report-page{ max-width:760px; margin-inline:auto; }
  }
  @media (min-width: 1200px){
    header.top .title-row, header.top .school-line, .tabs,
    .bottom-nav, #exportPanel, .toast, main{ max-width: 920px; }
  }

  @media print{
    header.top, .bottom-nav, .tabs, .modal-overlay, #exportPanel{display:none !important;}
    #appView{display:none !important;}
    #reportView{display:block !important;}
    body{background:#fff; padding-bottom:0;}
  }
</style>

  function makeFbDb(fs, uid){

          get: function(){ return col.get().then(function(sn){ return { docs: sn.docs.map(fbWrapDoc), size: sn.size, empty: sn.empty }; }, function(e){ throw fbErr(e); }); },

            }, function(e){ if (err) err(fbErr(e)); });

  function makeFbAssets(fs, uid){
    const filesCol = 'users/' + uid + '/files_trial';
    async function blobToB64(blob){
      const buf = new Uint8Array(await blob.arrayBuffer());

  // Pictures stored in Firestore are written in the page as "fsfile:<id>";

  function dataUriToBlob(dataUri){

  async function getFileBytes(ref){

  // The on-file signatures are part of the app itself, so they are not
  // stored again inside every document (they are put back on load).
  function stripForDb(item){
    const copy = JSON.parse(JSON.stringify(item));
    const sig = copy.signature;
    if (sig){
      const KNOWN = SEED.defaultCounselorSignatures || {};
      if (sig.counselors) Object.keys(sig.counselors).forEach(function(n){
        const c = sig.counselors[n];
        if (c && c.img && c.img === KNOWN[n]) c.img = null;
      });
      if (sig.principalImg && sig.principalImg === SEED.defaultPrincipalSignature) sig.principalImg = null;
    }

  }

  // Move any big inline picture of this item into file storage.
  async function offloadItem(item){
    if (!(cloud.assets && cloud.canWrite)) return;
    async function one(src){
      if (typeof src !== 'string' || src.indexOf('data:') !== 0 || src.length < INLINE_MIN) return src;
      return await storeImageData(src);
    }
    if (item.images) for (let i = 0; i < item.images.length; i++) item.images[i] = await one(item.images[i]);
    if (item.evidenceFiles) for (const ef of item.evidenceFiles){
      ef.data = await one(ef.data);
      if (ef.pages) for (let k = 0; k < ef.pages.length; k++) ef.pages[k] = await one(ef.pages[k]);
    }
    const sig = item.signature;
    if (sig){
      const KNOWN = SEED.defaultCounselorSignatures || {};
      if (sig.principalImg && sig.principalImg !== SEED.defaultPrincipalSignature) sig.principalImg = await one(sig.principalImg);
      if (sig.counselors) for (const n of Object.keys(sig.counselors)){
        const c = sig.counselors[n];
        if (c && c.img && c.img !== KNOWN[n]) c.img = await one(c.img);
      }
    }
  }

  async function cloudWriteOnce(key, buildBody){

    const bytes = new Blob([JSON.stringify(body)]).size;

  // One write at a time per document; edits that arrive meanwhile are

    if (q.running){ q.dirty = true; return; }

    (async function loop(){

      q.running = false;
    })();

  async function loadFromCloud(){
    const snap = await withTimeout(cloud.db.collection(CLOUD_COL).get(), 15000);
    if (!snap) return null;
    const keys = new Set();
    snap.docs.forEach(function(d){
      const data = d.data();
      if (!data) return;
      const copy = JSON.parse(JSON.stringify(data));
      if (d.id === 'meta'){
        state.meta = Object.assign({}, state.meta, copy);
        if (!state.meta.counselorsList) state.meta.counselorsList = (state.meta.counselors || '').split(' - ');
        keys.add('meta');
      } else if (d.id === 'order'){
        if (Array.isArray(copy.order) && copy.order.length) state.order = copy.order;
        keys.add('order');
      } else if (d.id.indexOf('item_') === 0){
        const id = d.id.slice(5);
        if (cloud.dirtyBeforeReady.has(id)) return;   // edited here while loading: keep that
        CACHE[id] = copy; keys.add('item:' + id);
      }
    });
    return keys;
  }

  // Other people's changes arrive live. The open item is never swapped
  // under the editor, and our own pending writes are ignored.
  function subscribeCloud(){
    let first = true;
    try{
      cloud.db.collection(CLOUD_COL).onSnapshot(function(snap){
        if (first){ first = false; return; }
        let changed = false;
        snap.docChanges().forEach(function(ch){
          const d = ch.doc;
          if (!d || (d.metadata && d.metadata.hasPendingWrites)) return;
          if (d.id === 'order' || d.id === 'meta'){
            const q0 = cloudQueue[d.id]; if (q0 && (q0.running || q0.dirty)) return;
            const data0 = d.data(); if (!data0) return;
            const c0 = JSON.parse(JSON.stringify(data0));
            if (d.id === 'order' && Array.isArray(c0.order) && JSON.stringify(c0.order) !== JSON.stringify(state.order)){ state.order = c0.order; changed = true; }
            if (d.id === 'meta' && JSON.stringify(c0) !== JSON.stringify(state.meta)){ state.meta = Object.assign({}, state.meta, c0); changed = true; }
            return;
          }
          if (d.id.indexOf('item_') !== 0) return;
          const id = d.id.slice(5);
          const q = cloudQueue['item:' + id];
          if (q && (q.running || q.dirty)) return;
          if (id === state.current) return;
          if (ch.type === 'removed'){
            if (CACHE[id] && /^custom-/.test(id)){ delete CACHE[id]; state.order = state.order.filter(function(x){ return x !== id; }); changed = true; }
            return;
          }
          const data = d.data(); if (!data) return;
          const copy = JSON.parse(JSON.stringify(data));
          if (CACHE[id] && JSON.stringify(stripForDb(CACHE[id])) === JSON.stringify(copy)) return;
          CACHE[id] = copy; ensureDefaultSignatures(copy); changed = true;
        });
        if (changed){ renderTabs(); if (state.current === 'home') renderMain(); }
      }, function(err){ console.warn('live updates stopped', err); });
    }catch(e){ console.warn('subscribe failed', e); }
  }

          : '<div style="text-align:right;">☁️ <b>قاعدة البيانات المدمجة مفعّلة</b> — الصور تُحفظ في تخزين مستقل بمساحة أكبر، ويراها كل من لديه صلاحية.</div>';

          try{
            const l = await cloud.assets.list();

        }
        if (!cloud.canWrite) html += '<div style="color:var(--danger);margin-top:6px;">⚠️ صلاحيتك عرض فقط — لا يمكنك إضافة صور أو تعديل.</div>';

        if (n && cloud.canWrite) html += '<button class="btn btn-teal btn-block" id="migrateBtn" style="margin-top:8px;">📤 نقل بياناتي الموجودة على هذا الجهاز إلى قاعدة البيانات (' + toArabicDigits(n) + ' عنصر)</button><div id="migrateProg" style="margin-top:6px;"></div>';
        body.innerHTML = html;
        const gl = body.querySelector('#googleLinkBtn'); if (gl) gl.addEventListener('click', linkGoogleAccount);
        const go = body.querySelector('#googleOutBtn'); if (go) go.addEventListener('click', signOutGoogle);
        const mb = body.querySelector('#migrateBtn');
        if (mb) mb.addEventListener('click', function(){ migrateLocalToCloud(card); });
      } else {
        let chars = 0;
        try{ for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.indexOf(LS_PREFIX) === 0) chars += (localStorage.getItem(k) || '').length + k.length; } }catch(e){}
        const pct = chars / 5200000 * 100;
        body.innerHTML = '💻 <b>تخزين محلي على هذا الجهاز</b>' + bar(pct) + '<div>الممتلئ تقريبًا: ' + toArabicDigits(Math.round(pct)) + '٪ (تقدير). عند الامتلاء لا تُحفظ صور جديدة.' + (pct > 80 ? ' <b style="color:var(--danger);">المساحة شبه ممتلئة.</b>' : '') + '<br>للحصول على مساحة أكبر افتحي التطبيق من رابط Claude المنشور ليستخدم قاعدة البيانات المدمجة.</div>';
      }
    }catch(e){ body.textContent = ''; }
  }
  async function migrateLocalToCloud(card){
    const keys = Array.from(cloud.localOnly);
    const prog = card.querySelector('#migrateProg');
    const btn = card.querySelector('#migrateBtn');
    if (btn) btn.disabled = true;
    let done = 0;
    for (const key of keys){
      if (prog) prog.textContent = 'جارٍ النقل… ' + toArabicDigits(done) + ' / ' + toArabicDigits(keys.length);
      try{
        if (key === 'meta') await cloudWriteOnce('meta', async function(){ return JSON.parse(JSON.stringify(state.meta)); });
        else if (key === 'order') await cloudWriteOnce('order', async function(){ return { order: state.order.slice() }; });
        else if (key.indexOf('item:') === 0){
          const id = key.slice(5);
          if (CACHE[id]) await cloudWriteOnce(key, function(){ return buildItemBody(id); });
          else cloud.localOnly.delete(key);
        }
      }catch(e){ handleCloudError(e, 'doc'); }
      done++;
    }
    fillStorageCard(card);
    toast(cloud.localOnly.size ? 'اكتمل النقل جزئيًا — أعيدي المحاولة للعناصر المتبقية' : 'تم نقل كل البيانات إلى قاعدة البيانات ✅');
  }

  // ---------------- init / load ----------------
  function syncCounselorsCombined(){
    state.meta.counselors = state.meta.counselorsList.filter(Boolean).join(' - ');
  }

  function init(){
    // Fill in default signatures for every item right away — not just the
    // one currently open — so overview marks, exports, and the follow-up
    // dashboard are correct even for items nobody has opened yet.
    for (const id of SEED.weeks.map(w=>w.id).concat(SEED.programs.map(p=>p.id), SEED.needsPrograms.map(p=>p.id))){
      if (CACHE[id]) ensureDefaultSignatures(CACHE[id]);
    }

    $('#schoolNameInput').value = state.meta.school_name || '';
    $('#counselorInput1').value = state.meta.counselorsList[0] || '';
    $('#counselorInput2').value = state.meta.counselorsList[1] || '';
    $('#schoolNameInput').addEventListener('change', ()=>{ state.meta.school_name = $('#schoolNameInput').value; saveMeta(); });
    $('#counselorInput1').addEventListener('change', ()=>{ state.meta.counselorsList[0] = $('#counselorInput1').value; syncCounselorsCombined(); saveMeta(); });
    $('#counselorInput2').addEventListener('change', ()=>{ state.meta.counselorsList[1] = $('#counselorInput2').value; syncCounselorsCombined(); saveMeta(); });

    // render immediately from the bundled seed data — never wait on storage
    renderTabs();
    renderMain();

    $('#addBtn').addEventListener('click', onAddSection);
    $('#reportBtn').addEventListener('click', showReport);
    $('#backupJsonBtn').addEventListener('click', downloadBackupJson);
    $('#backupExcelBtn').addEventListener('click', downloadBackupExcel);
    $('#backupPdfBtn').addEventListener('click', showReport);
    $('#backupDriveBtn').addEventListener('click', saveToGoogleDrive);

    // background: try to load any previously saved edits and merge them in
    loadPersistedDataInBackground();
  }

  async function loadPersistedDataInBackground(){
    try{
      const haveDb = await initCloud();
      const localKeys = new Set();

      // 1) what is stored on this device (also the legacy source when the
      //    database is empty)
      const savedMeta = await storGet('meta');
      if (savedMeta){
        state.meta = savedMeta;
        if (!state.meta.counselorsList) state.meta.counselorsList = (state.meta.counselors||'').split(' - ');
        localKeys.add('meta');
      }
      const savedOrder = await storGet('order');
      if (savedOrder && savedOrder.length){ state.order = savedOrder; localKeys.add('order'); }

      const allIds = state.order.concat(state.programOrder, state.needsOrder);
      for (const id of allIds){
        const saved = await storGet('item:'+id);
        if (saved && !cloud.dirtyBeforeReady.has(id)){ CACHE[id] = saved; }
        if (saved) localKeys.add('item:'+id);
      }

      // 2) the database overrides it
      if (haveDb){
        const dbKeys = await loadFromCloud();
        if (dbKeys){
          cloud.ready = true;
          localKeys.forEach(function(k){ if (!dbKeys.has(k)) cloud.localOnly.add(k); });
          // edits made here while loading were only saved on this device
          cloud.dirtyBeforeReady.forEach(function(id){ cloud.localOnly.add('item:'+id); });
          subscribeCloud();
          hydrateFsImages(document);
        }
      }

      Object.keys(CACHE).forEach(function(id){ ensureDefaultSignatures(CACHE[id]); });

      $('#schoolNameInput').value = state.meta.school_name || '';
      $('#counselorInput1').value = state.meta.counselorsList[0] || '';
      $('#counselorInput2').value = state.meta.counselorsList[1] || '';
      renderTabs();
      renderMain();
    }catch(e){
      console.error('background load failed', e);
    }
  }

  // ---------------- tabs ----------------
  function renderTabs(){
    const bar = $('#tabsBar');
    bar.innerHTML = '';
    const homeTab = document.createElement('button');
    homeTab.className = 'tab' + (state.current==='home' ? ' active' : '');
    homeTab.textContent = '🏠 الرئيسية';
    homeTab.onclick = ()=>selectTab('home');
    bar.appendChild(homeTab);

    for (const id of state.order){
      const it = CACHE[id];
      if (!it) continue;
      const tab = document.createElement('button');
      tab.className = 'tab' + (state.current===id?' active':'') + (it.status && it.status.done ? ' done':'');
      tab.innerHTML = (it.kind==='week' ? it.n : '📌') + ' <span class="dot"></span>';
      tab.title = it.title;
      tab.onclick = ()=>selectTab(id);
      bar.appendChild(tab);
    }
    const activeEl = bar.querySelector('.tab.active');
    if (activeEl) activeEl.scrollIntoView({behavior:'instant', inline:'nearest', block:'nearest'});
  }

  function toArabicDigits(n){
    const map = {0:'٠',1:'١',2:'٢',3:'٣',4:'٤',5:'٥',6:'٦',7:'٧',8:'٨',9:'٩'};
    return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join('');
  }

  function selectTab(id){
    state.current = id;
    renderTabs();
    renderMain();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // ---------------- main render dispatcher ----------------
  let activePoll = null;
  function clearActivePoll(){ if (activePoll){ clearInterval(activePoll); activePoll = null; } }

  function renderMain(){
    clearActivePoll();
    const main = $('#mainArea');
    main.innerHTML = '';
    if (state.current === 'home'){
      main.appendChild(buildHome());
    } else {
      const item = CACHE[state.current];
      if (!item){ main.innerHTML = '<div class="empty-hint">تعذّر تحميل هذا القسم</div>'; return; }
      if (item.kind === 'program'){
        main.appendChild(buildProgramCard(item));
      } else {
        main.appendChild(buildWeekCard(item));
      }
    }
  }

  function escapeHtml(s){
    if (s==null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

            : `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#fdecf1;color:var(--ink);font-size:10px;text-align:center;padding:4px;">
                 <span style="font-size:22px;">📕</span>${escapeHtml(ef.name||'PDF')}

    renderEvFilesGrid();

    async function addEvidenceFile(file){
      if (!file) return;
      item.evidenceFiles = item.evidenceFiles || [];
      if (file.type === 'application/pdf'){
        if (file.size > 8*1024*1024){ toast('ملف PDF كبير جدًا (الحد ٨ ميجابايت)'); return; }
        const reader = new FileReader();
        reader.onload = async (e)=>{
          const ef = {type:'pdf', name:file.name, data: await storeImageData(e.target.result)};
          item.evidenceFiles.push(ef);
          saveItem(item.id, item); renderEvFilesGrid(); toast('تمت إضافة ملف PDF — جارٍ تحويل صفحاته إلى صور…');
          convertPdfPreviews(item, ef).then(function(ok){
            renderEvFilesGrid();
            toast(ok ? 'تم تحويل PDF إلى صور ستظهر في التقرير' : 'تعذّر تحويل صفحات PDF (يلزم اتصال بالإنترنت) — سيُذكر اسمه فقط');
          });
        };
        reader.readAsDataURL(file);
      } else if (file.type.startsWith('image/')){
        const resized = await resizeImageFile(file, 900, 0.75);
        item.evidenceFiles.push({type:'image', name:file.name, data: await storeImageData(resized)});
        saveItem(item.id, item); renderEvFilesGrid(); toast('تمت إضافة الصورة');
      } else {
        toast('صيغة غير مدعومة — صورة أو PDF فقط');
      }
    }

    const evDz = evFilesHead.querySelector('#evDropZone');
    evDz.addEventListener('paste', (e)=>{
      const items = (e.clipboardData || window.clipboardData).items;
      for (const it2 of items){
        if (it2.type.indexOf('image') === 0){ addEvidenceFile(it2.getAsFile()); }
      }
    });
    evDz.addEventListener('click', ()=> evFilesHead.querySelector('#evFileInput').click());
    evDz.addEventListener('dragover', (e)=>{ e.preventDefault(); evDz.classList.add('drag'); });
    evDz.addEventListener('dragleave', ()=> evDz.classList.remove('drag'));
    evDz.addEventListener('drop', (e)=>{
      e.preventDefault(); evDz.classList.remove('drag');
      for (const f of e.dataTransfer.files) addEvidenceFile(f);
    });
    evFilesHead.querySelector('#evChooseFileBtn').addEventListener('click', ()=> evFilesHead.querySelector('#evFileInput').click());
    evFilesHead.querySelector('#evFileInput').addEventListener('change', (e)=>{
      for (const f of e.target.files) addEvidenceFile(f);
      e.target.value = '';
    });

    // images
    const imgCard = buildImagesCard(item);
    wrap.appendChild(imgCard);

    // notes / report text
    const notesCard = document.createElement('div');
    notesCard.className = 'card';
    notesCard.innerHTML = `<h2>🗒️ ملاحظات وتقرير التنفيذ</h2>
      <div class="field"><textarea id="f-notes" style="min-height:100px" placeholder="اكتبي هنا ملاحظاتك أو مسودة تقرير تنفيذ هذا الأسبوع...">${escapeHtml(item.notes||'')}</textarea></div>`;
    wrap.appendChild(notesCard);
    bindInput(notesCard,'#f-notes', v=>item.notes=v, item.id);

    // status
    const statusCard = document.createElement('div');
    statusCard.className = 'card';
    statusCard.innerHTML = `<h2>✅ حالة التنفيذ</h2>
      <div class="status-toggles">
        <button class="status-btn ${item.status&&item.status.done?'on':''}" id="btn-done">☑️ نُفِّذ</button>
        <button class="status-btn ${item.status&&item.status.documented?'on':''}" id="btn-doc">☑️ وُثِّق في نظام نور</button>
      </div>`;
    wrap.appendChild(statusCard);
    statusCard.querySelector('#btn-done').addEventListener('click', async ()=>{
      item.status = item.status || {}; item.status.done = !item.status.done;
      saveItem(item.id, item); renderTabs();
      statusCard.querySelector('#btn-done').classList.toggle('on', item.status.done);
    });
    statusCard.querySelector('#btn-doc').addEventListener('click', async ()=>{
      item.status = item.status || {}; item.status.documented = !item.status.documented;
      saveItem(item.id, item);
      statusCard.querySelector('#btn-doc').classList.toggle('on', item.status.documented);
    });

    // signature
    wrap.appendChild(buildSignatureCard(item));

    // per-item PDF for education-department officials
    const pdfCard = document.createElement('div');
    pdfCard.className = 'card';
    pdfCard.innerHTML = `<button class="btn btn-teal btn-block">📄 تصدير PDF لهذا الأسبوع (لمسؤولي التعليم)</button>`;
    pdfCard.querySelector('button').addEventListener('click', ()=> showItemReport(item));
    wrap.appendChild(pdfCard);

    // delete section (only for custom ones, or allow for all with confirm)
    const delCard = document.createElement('div');
    delCard.className = 'card';
    delCard.innerHTML = `<button class="btn btn-danger-outline btn-block">🗑️ حذف هذا القسم</button>`;
    delCard.querySelector('button').addEventListener('click', ()=> confirmDeleteSection(item.id));
    wrap.appendChild(delCard);

    return wrap;
  }

  // ---------------- reusable: signature card (counselor + principal) ----------------
  // Composites a labeled, self-explanatory PNG from a drawn signature pad
  // (title / name / date / comment baked in as text) and downloads it —
  // the guaranteed-to-work path when there's no backend to sync back to.
  function downloadComposedSignature(padCanvas, title, name, dateStr, comment){
    const out = document.createElement('canvas');
    out.width = 640; out.height = 360;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,out.width,out.height);
    ctx.fillStyle = '#0a5c63'; ctx.font = 'bold 20px Tahoma';
    ctx.direction = 'rtl'; ctx.textAlign = 'right';
    ctx.fillText(title||'', out.width-20, 34);
    ctx.fillStyle = '#1e2a2a'; ctx.font = '16px Tahoma';
    ctx.fillText('الاسم: ' + (name||''), out.width-20, 66);
    ctx.fillText('التاريخ: ' + (dateStr||''), out.width-20, 92);
    if (comment){ ctx.font = '13px Tahoma'; ctx.fillText('ملاحظة: ' + comment, out.width-20, 114); }
    ctx.strokeStyle = '#c9a463'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(20,130); ctx.lineTo(out.width-20,130); ctx.stroke();
    ctx.drawImage(padCanvas, 20, 145, out.width-40, 190);
    const url = out.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = 'توقيع-' + (name||'').replace(/\s+/g,'_') + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function setupSignaturePad(canvas, initialData, onChange, locked){
    if (!canvas) return { clear(){} };
    const dpr = window.devicePixelRatio || 1;
    function currentSize(){
      // getBoundingClientRect can still report 0 right after an innerHTML
      // swap on some layout timings (this is especially true inside an
      // embedding iframe that auto-sizes itself to content — the canvas can
      // briefly have no real size until that settles); clientWidth/height
      // and a fixed fallback keep this from ever fitting into a 0px canvas.
      const rect = canvas.getBoundingClientRect();
      const w = rect.width || canvas.clientWidth || 300;
      const h = rect.height || canvas.clientHeight || 110;
      return { w, h };
    }
    let img = null;
    function redraw(){
      const {w, h} = currentSize();
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#1e2a2a';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      if (img && img.complete && img.naturalWidth){
        ctx.drawImage(img, 0, 0, w, h);
      }
    }
    if (initialData){
      img = new Image();
      img.onload = redraw;
      img.onerror = ()=>{
        const {w, h} = currentSize();
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fdecf1'; ctx.fillRect(0,0,w,h);
        ctx.fillStyle = '#c0567a'; ctx.font = '11px Tahoma'; ctx.textAlign = 'center';
        ctx.fillText('⚠️ تعذّر تحميل صورة التوقيع', w/2, h/2);
      };
      img.src = initialData;
    }
    redraw();
    // Belt-and-braces against any layout that keeps settling after this
    // point (embedding iframes that resize themselves, slow style/font
    // loads, etc.): re-fit a few more times shortly after mount, and keep
    // watching for real size changes for as long as this pad exists.
    [50, 200, 600].forEach(ms => setTimeout(redraw, ms));
    let ro = null;
    if (typeof ResizeObserver !== 'undefined'){
      ro = new ResizeObserver(()=> redraw());
      ro.observe(canvas);
    }
    if (locked) return { clear(){}, destroy(){ if (ro) ro.disconnect(); } };
    let drawing = false, last = null;
    const ctx = canvas.getContext('2d');
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    }
    function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
    function move(e){
      if (!drawing) return; e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p;
    }
    function end(){
      if (!drawing) return;
      drawing = false;
      img = null; // freehand strokes now define the canvas, not the old image
      onChange(canvas.toDataURL('image/png'));
    }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
    return {
      clear(){
        img = null;
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,rect.width,rect.height);
        onChange(null);
      },
      destroy(){ if (ro) ro.disconnect(); }
    };
  }

  // Fills in the default, on-file signatures for an item (both counselors +
  // principal) if they aren't already set. This is the single source of
  // truth for "what a signature looks like by default" — called both when
  // rendering an item's page AND before any export, so a week/program that
  // the user never opened in this session still exports with its
  // signatures, instead of only picking them up once visited.
  function ensureDefaultSignatures(item){
    item.signature = item.signature || {counselorName:'',principalName:'',date:'',counselorImg:null,principalImg:null};
    const sig = item.signature;
    if (!sig.principalName && state.meta.principal) sig.principalName = state.meta.principal;

    const counselorNames = (state.meta.counselorsList||[]).filter(Boolean);
    const KNOWN_SIGNATURES = SEED.defaultCounselorSignatures || {};
    sig.counselors = sig.counselors || {};
    counselorNames.forEach(name=>{
      const c = sig.counselors[name] = sig.counselors[name] || { included:true, img:null, locked:false, unlockedOnce:false };
      if (!c.img && KNOWN_SIGNATURES[name] && !c.unlockedOnce){
        c.img = KNOWN_SIGNATURES[name];
        c.locked = true;
      }
      if (c.img) c.locked = true;
    });

    if (!sig.principalImg && SEED.defaultPrincipalSignature && !sig.principalUnlockedOnce){
      sig.principalImg = SEED.defaultPrincipalSignature;
      sig.principalLocked = true;
    }
    if (sig.principalImg) sig.principalLocked = true;
    return sig;
  }

  function buildSignatureCard(item){
    const sig = ensureDefaultSignatures(item);
    const counselorNames = (state.meta.counselorsList||[]).filter(Boolean);
    const KNOWN_SIGNATURES = SEED.defaultCounselorSignatures || {};

    const card = document.createElement('div');
    card.className = 'card';

    function counselorBlockHtml(name, idx){
      const c = sig.counselors[name];
      const canvasId = 'sig-counselor-canvas-'+idx;
      // Locked = read-only display: a plain <img> is far more reliable than
      // drawing onto a canvas (no sizing/timing dependency at all — it just
      // renders like any other image, the same on every device/browser).
      const padHtml = c.locked ? `
          <div class="sig-canvas-wrap" style="opacity:${c.included?0.9:0.4};position:relative;padding:4px;">
            <img src="${c.img}" style="display:block;width:100%;height:110px;object-fit:contain;">
            <div style="position:absolute;top:4px;left:6px;font-size:13px;">🔒</div>
          </div>
          <div class="sig-actions"><span>موقّع ومقفل لمنع المسح</span><button class="unlock-counselor" data-idx="${idx}" style="color:var(--danger);">🔓 فتح القفل</button></div>
        ` : `
          <div class="sig-canvas-wrap"><canvas id="${canvasId}" tabindex="0"></canvas></div>
          <div class="sig-actions"><span>ارسمي، أو الصقي/ارفعي صورة التوقيع</span><button class="clear-counselor" data-idx="${idx}">مسح</button></div>
          <input type="file" class="import-counselor-file" data-idx="${idx}" accept="image/*" style="display:none;">
          <button class="btn btn-outline btn-block btn-sm import-counselor" data-idx="${idx}" style="margin-top:6px;">📥 رفع صورة التوقيع</button>
        `;
      return `
        <div class="sig-person">
          <div class="sig-title" style="display:flex;align-items:center;justify-content:space-between;">
            <span>توقيع الموجه: ${escapeHtml(name)}</span>
            <label style="font-size:11px;font-weight:normal;display:flex;align-items:center;gap:4px;cursor:pointer;">
              <input type="checkbox" class="counselor-include" data-idx="${idx}" ${c.included?'checked':''}> تضمين
            </label>
          </div>
          ${padHtml}
        </div>`;
    }

    const principalPadBlock = sig.principalLocked ? `
          <div class="sig-canvas-wrap" style="opacity:.9;position:relative;padding:4px;">
            <img src="${sig.principalImg}" style="display:block;width:100%;height:110px;object-fit:contain;">
            <div style="position:absolute;top:4px;left:6px;font-size:13px;">🔒</div>
          </div>
          <div class="sig-actions"><span>موقّع ومقفل لمنع المسح</span><button id="unlock-principal" style="color:var(--danger);">🔓 فتح القفل</button></div>
        ` : `
          <div class="sig-canvas-wrap"><canvas id="sig-principal-canvas"></canvas></div>
          <div class="sig-actions"><span>ارسمي التوقيع بإصبعك أو الفأرة</span><button id="clear-principal">مسح</button></div>
        `;
    card.innerHTML = `
      <h2>✍️ التوقيع</h2>
      <div class="field"><label>التاريخ</label><input type="text" id="sig-date" placeholder="مثال: ١٤٤٨/٣/١٤هـ" value="${escapeAttr(sig.date||'')}"></div>
      <div class="sig-block">
        ${counselorNames.map((name,idx)=>counselorBlockHtml(name,idx)).join('')}
        <div class="sig-person">
          <div class="sig-title">توقيع مدير المدرسة / من يهمه الأمر</div>
          <input type="text" id="sig-principal-name" placeholder="الاسم" value="${escapeAttr(sig.principalName||'')}" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;margin-bottom:6px;" ${sig.principalLocked?'readonly':''}>
          ${principalPadBlock}

          <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;">
            ${buildHostingHelpHtml()}
            <div class="empty-hint" style="text-align:right;margin-bottom:6px;">📱 رابط واتساب للمدير — يوقّع من جهازه ويصل توقيعه هنا تلقائيًا:</div>
            <a class="btn btn-teal btn-block btn-sm" id="wa-send-link" target="_blank" style="display:block;text-align:center;text-decoration:none;">💬 إرسال رابط التوقيع عبر واتساب</a>
            <div style="display:flex;gap:6px;margin-top:6px;">
              <input type="text" id="sig-link" readonly style="flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:11px;color:var(--muted);" value="${escapeAttr(buildSignLink(item.id))}">
              <button class="icon-btn" id="copy-link" title="نسخ الرابط">📋</button>
            </div>
            <div class="empty-hint" id="sync-status" style="margin-top:6px;">${sig.principalImg ? '✅ تم استلام التوقيع' : '⏳ لم يصل توقيع بعد عبر الرابط'}</div>
          </div>

          ${!sig.principalLocked ? `
          <div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;">
            <div class="empty-hint" style="text-align:right;margin-bottom:6px;">أو بديل بلا إنترنت: أرسلي نموذجًا كملف يوقّعه ويرسل الصورة يدويًا:</div>
            <button class="btn btn-outline btn-block btn-sm" id="export-request">📤 تنزيل نموذج توقيع لإرساله (واتساب/بريد)</button>
            <input type="file" id="import-sig-file" accept="image/*" style="display:none;">
            <button class="btn btn-outline btn-block btn-sm" id="import-sig" style="margin-top:6px;">📥 رفع التوقيع المستلم (صورة)</button>
          </div>` : ''}
        </div>
      </div>
    `;
    bindInput(card,'#sig-date', v=>sig.date=v, item.id);
    if (!sig.principalLocked) bindInput(card,'#sig-principal-name', v=>sig.principalName=v, item.id);

    if (sig.principalLocked){
      card.querySelector('#unlock-principal').addEventListener('click', ()=>{
        sig.principalLocked = false; sig.principalImg = null; sig.principalUnlockedOnce = true;
        saveItem(item.id, item); renderMain();
      });
    }

    // wire each counselor slot: include toggle, unlock, clear, upload, paste
    counselorNames.forEach((name, idx)=>{
      const c = sig.counselors[name];
      const includeCb = card.querySelector(`.counselor-include[data-idx="${idx}"]`);
      includeCb.addEventListener('change', ()=>{
        c.included = includeCb.checked;
        saveItem(item.id, item);
        renderMain();
      });
      const unlockBtn = card.querySelector(`.unlock-counselor[data-idx="${idx}"]`);
      if (unlockBtn) unlockBtn.addEventListener('click', ()=>{
        c.locked = false; c.img = null; c.unlockedOnce = true;
        saveItem(item.id, item); renderMain();
      });
      const importBtn = card.querySelector(`.import-counselor[data-idx="${idx}"]`);
      if (importBtn){
        const fileInput = card.querySelector(`.import-counselor-file[data-idx="${idx}"]`);
        importBtn.addEventListener('click', ()=> fileInput.click());
        fileInput.addEventListener('change', async (e)=>{
          const file = e.target.files[0];
          if (file && file.type.startsWith('image/')){
            c.img = await resizeImageFile(file, 700, 0.85);
            saveItem(item.id, item); renderMain();
          }
          e.target.value = '';
        });
      }
      const clearBtn = card.querySelector(`.clear-counselor[data-idx="${idx}"]`);
      if (clearBtn) clearBtn.addEventListener('click', ()=>{
        const canvas = card.querySelector('#sig-counselor-canvas-'+idx);
        const ctx = canvas.getContext('2d'); const r = canvas.getBoundingClientRect();
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,r.width,r.height);
        c.img = null; saveItem(item.id, item);
      });
    });

    const link = buildSignLink(item.id);
    const waText = encodeURIComponent('يرجى التوقيع/الاعتماد على "'+(item.title||'')+'" عبر هذا الرابط:\n'+link);
    card.querySelector('#wa-send-link').href = 'https://wa.me/?text='+waText;
    card.querySelector('#copy-link').addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(link); toast('تم نسخ الرابط'); }
      catch(e){ const li=card.querySelector('#sig-link'); li.select(); document.execCommand('copy'); toast('تم نسخ الرابط'); }
    });

    if (!sig.principalLocked){
      card.querySelector('#export-request').addEventListener('click', ()=> downloadStandaloneRequest(item));
      card.querySelector('#import-sig').addEventListener('click', ()=> card.querySelector('#import-sig-file').click());
      card.querySelector('#import-sig-file').addEventListener('change', (e)=>{
        const file = e.target.files[0];
        handleReceivedSignatureImage(item, file, ()=> renderMain(), 'principalImg');
        e.target.value = '';
      });
    }

    // silent auto-check: if the principal already signed via the link, pull
    // it in automatically — no button press needed. Also poll every 12s
    // while this item stays open, for a "live" feel without a page reload.
    if (hasArtifactStorage && !sig.principalLocked){
      checkIncomingSignature(item, ()=>{ if (state.current===item.id) renderMain(); }, true);
      clearActivePoll();
      activePoll = setInterval(()=>{
        if (state.current !== item.id){ clearActivePoll(); return; }
        checkIncomingSignature(item, ()=>{ if (state.current===item.id) renderMain(); }, true);
      }, 12000);
    }

    // pads are set up after the card is attached to the DOM (needs layout for getBoundingClientRect)
    requestAnimationFrame(()=>{
      counselorNames.forEach((name, idx)=>{
        const c = sig.counselors[name];
        if (c.locked) return; // shown as a plain <img> already, no pad needed
        const canvas = card.querySelector('#sig-counselor-canvas-'+idx);
        setupSignaturePad(canvas, c.img, async (data)=>{ c.img = data; saveItem(item.id, item); }, false);
      });
      if (!sig.principalLocked){
        const pCanvas = card.querySelector('#sig-principal-canvas');
        setupSignaturePad(pCanvas, sig.principalImg, async (data)=>{ sig.principalImg = data; saveItem(item.id, item); }, false);
        card.querySelector('#clear-principal').addEventListener('click', ()=> {
          const c = pCanvas.getContext('2d'); const r = pCanvas.getBoundingClientRect();
          c.fillStyle = '#fff'; c.fillRect(0,0,r.width,r.height);
          sig.principalImg = null; saveItem(item.id, item);
        });
      }
    });
    return card;
  }

  // ---------------- image resize helper ----------------
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let { width, height } = img;
          if (width > maxDim || height > maxDim){
            if (width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
            else { width = Math.round(width * maxDim/height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------------- PDF attachments -> page images ----------------
  // A PDF can't be drawn into a printed/exported report as-is, so its first
  // pages are turned into images (pdf.js, loaded from cdnjs only when a PDF
  // is actually attached or exported). If the library can't be loaded, the
  // report falls back to listing the file name.
  const PDF_PREVIEW_MAX_PAGES = 3;
  const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  let pdfJsPromise = null;

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      const sc = document.createElement('script');
      sc.src = src; sc.onload = resolve;
      sc.onerror = function(){ reject(new Error('load failed: ' + src)); };
      document.head.appendChild(sc);
    });
  }
  function loadPdfJs(){
    if (window.pdfjsLib && window.pdfjsLib.getDocument) return Promise.resolve(window.pdfjsLib);
    if (!pdfJsPromise){
      pdfJsPromise = loadScriptOnce(PDFJS_BASE + 'pdf.min.js')
        // loading the worker file as a plain script lets pdf.js run it on the
        // main thread, with no separate Worker to be blocked
        .then(function(){ return loadScriptOnce(PDFJS_BASE + 'pdf.worker.min.js').catch(function(){}); })
        .then(function(){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
          return window.pdfjsLib;
        })
        .catch(function(e){ pdfJsPromise = null; throw e; });
    }
    return pdfJsPromise;
  }
  function dataUriToBytes(dataUri){
    const bin = atob(dataUri.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function renderPdfPages(fileRef, maxPages){
    const pdfjs = await loadPdfJs();
    const doc = await pdfjs.getDocument({ data: await getFileBytes(fileRef) }).promise;
    const total = doc.numPages;
    const pages = [];
    for (let p = 1; p <= Math.min(total, maxPages); p++){
      const page = await doc.getPage(p);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(2, 900 / base.width) });
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, canvas: canvas, viewport: vp }).promise;
      pages.push(canvas.toDataURL('image/jpeg', 0.72));
      if (page.cleanup) page.cleanup();
    }
    try { doc.destroy(); } catch (e) {}
    return { pages: pages, total: total };
  }
  async function convertPdfPreviews(item, ef){
    try{
      ef.pdfFailed = false;
      const r = await renderPdfPages(ef.data, PDF_PREVIEW_MAX_PAGES);
      const storedPages = [];
      for (const pg of r.pages) storedPages.push(await storeImageData(pg));
      ef.pages = storedPages; ef.pageCount = r.total;
      saveItem(item.id, item);
      return true;
    }catch(e){
      console.warn('pdf conversion failed', e);
      ef.pdfFailed = true;
      return false;
    }
  }
  // Before building a report: convert any attached PDF that has no page
  // images yet (e.g. attached earlier, or the conversion failed then).
  async function ensurePdfPreviews(items){
    const todo = [];
    items.forEach(function(it){
      (it.evidenceFiles || []).forEach(function(ef){
        if (ef.type === 'pdf' && !(ef.pages && ef.pages.length)) todo.push([it, ef]);
      });
    });
    if (!todo.length) return;
    toast('جارٍ تحويل صفحات PDF إلى صور للتقرير…');
    for (const pair of todo) await convertPdfPreviews(pair[0], pair[1]);
  }
  function openPdfFile(ef){
    try{
      if (typeof ef.data === 'string' && ef.data.indexOf('/_blob/') === 0){ window.open(ef.data, '_blank'); return; }
      if (typeof ef.data === 'string' && ef.data.indexOf('fsfile:') === 0){
        const w = window.open('', '_blank');
        getFileBytes(ef.data).then(function(b){ const u = URL.createObjectURL(new Blob([b], { type:'application/pdf' })); if (w) w.location.href = u; else window.open(u, '_blank'); }).catch(function(){ if (w) w.close(); toast('تعذّر فتح الملف'); });
        return;
      }
      const url = URL.createObjectURL(new Blob([dataUriToBytes(ef.data)], { type: 'application/pdf' }));
      window.open(url, '_blank');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    }catch(e){ toast('تعذّر فتح الملف'); }
  }

  function downloadBackupExcel(){
    const blob = buildBackupCsvBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'نسخة-احتياطية-خطة-التوجيه.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('تم تنزيل نسخة Excel (CSV)');
  }

  function buildBackupCsvBlob(){
    const counselorNames = (state.meta.counselorsList||[]).filter(Boolean);
    const header = ['النوع','الرقم','العنوان','التاريخ/المناسبة','الهدف/المتطلبات','الفئة المستهدفة','الإجراءات/التعليق','شواهد التنفيذ','ملاحظات','نُفِّذ','موثّق/معتمد','إعداد']
      .concat(counselorNames.map(n=>'توقيع الموجه: '+n))
      .concat(['توقيع مدير المدرسة']);
    const rows = [header];

    function counselorCols(it){
      const s = it.signature || {};
      return counselorNames.map(name=>{
        const c = s.counselors && s.counselors[name];
        return (c && c.included !== false && c.img) ? 'نعم' : 'لا';
      });
    }
    function principalCol(it){
      return (it.signature && it.signature.principalImg) ? 'نعم' : 'لا';
    }

    for (const id of state.order){
      const it = CACHE[id]; if (!it) continue;
      ensureDefaultSignatures(it);
      rows.push([
        it.kind==='week' ? 'أسبوع' : 'قسم إضافي',
        it.n || '', it.title||'', [it.dates,it.occasion].filter(Boolean).join(' | '),
        it.goal||'', it.audience||'', (it.items||[]).join(' ؛ '), (it.evidence||[]).join('، '),
        it.notes||'', it.status&&it.status.done?'نعم':'لا', it.status&&it.status.documented?'نعم':'لا', ''
      ].concat(counselorCols(it), [principalCol(it)]));
    }
    for (const id of (state.programOrder||[]).concat(state.needsOrder||[])){
      const it = CACHE[id]; if (!it) continue;
      ensureDefaultSignatures(it);
      rows.push([
        'برنامج', '', it.title||'', '', it.requirements||'', it.audience||'', it.comment||'', '',
        '', '', principalCol(it), it.preparedBy||''
      ].concat(counselorCols(it), [principalCol(it)]));
    }
    const csv = '\uFEFF' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
    return new Blob([csv], {type:'text/csv;charset=utf-8;'});
  }

  // Google Drive has no way to accept an uploaded file from plain page
  // JavaScript without an OAuth app registered for this exact site — that
  // infrastructure doesn't exist for a static file like this one. The
  // honest, always-working substitute: download the file here, then open
  // Drive's upload folder so dropping it in takes one extra step instead of
  // a dozen.
  function saveToGoogleDrive(){
    const blob = buildBackupCsvBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'نسخة-احتياطية-خطة-التوجيه.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    window.open('https://drive.google.com/drive/my-drive', '_blank');
    toast('نُزِّل الملف — اسحبيه الآن إلى Google Drive في النافذة التي فُتحت');
  }

  // ---------------- send-for-signature: real file exchange (no server needed) ----------------
  // A file:// path can never be sent to anyone else, so instead of a "link" we
  // generate an actual standalone HTML file the counselor can attach in
  // WhatsApp/email. Whoever opens it sees only this one item, signs, and the
  // page produces a single PNG image (with their name/date baked into it)
  // that they send back like any photo. The counselor then uploads that PNG
  // here, which fills the signature in with one tap — no manual redrawing,
  // no server, no fake link.

  function buildStandaloneRequestHTML(item){
    const title = item.title || '';

    const bits = [];

    const bitsHtml = bits.map(([l,v])=>`<div style="margin:6px 0;"><b style="color:#0a5c63;">${escapeHtml(l)}:</b> ${escapeHtml(v)}</div>`).join('');
    const schoolName = escapeHtml(state.meta.school_name||'');

    // Self-contained document: inline everything, no external files, no CDN.
    return `<!DOCTYPE html>

  .btn-teal{background:#0e7c86;color:#fff;width:100%;}
  .btn-clear{background:none;border:1px solid #e1ebea;color:#5c6b6a;font-weight:normal;font-size:11.5px;padding:4px 10px;}

</style></head>

    <div class="field">

    </div>
    <button class="btn-teal" id="go">⬇️ تنزيل التوقيع كصورة لإرسالها</button>

  </div>
<script>
(function(){
  var canvas = document.getElementById('pad');
  var dpr = window.devicePixelRatio || 1;
  function fit(){
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width*dpr));
    canvas.height = Math.max(1, Math.round(r.height*dpr));
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,r.width,r.height);
    ctx.strokeStyle = '#1e2a2a'; ctx.lineWidth = 2; ctx.lineCap='round';
  }
  fit();
  var ctx = canvas.getContext('2d');
  var drawing=false, last=null, hasDrawn=false;
  function pos(e){ var r=canvas.getBoundingClientRect(); var p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top}; }
  function start(e){ e.preventDefault(); drawing=true; last=pos(e); }
  function move(e){ if(!drawing) return; e.preventDefault(); var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; hasDrawn=true; }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
  document.getElementById('clr').addEventListener('click', function(){
    var r=canvas.getBoundingClientRect(); ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height); hasDrawn=false;
  });
  document.getElementById('go').addEventListener('click', function(){

    octx.moveTo(20,130); octx.lineTo(out.width-20,130); octx.stroke();

  function downloadStandaloneRequest(item){

  async function handleReceivedSignatureImage(item, file, onDone, targetField){
    targetField = targetField || 'principalImg';
    if (!file || !file.type.startsWith('image/')) { toast('يرجى اختيار ملف صورة'); return; }
    const resized = await resizeImageFile(file, 700, 0.85);
    item.signature = item.signature || {};

    saveItem(item.id, item);
    toast('تم إدراج التوقيع ✅');

  }

  // ---------------- WhatsApp signing link (auto-sync) ----------------
  // Works fully automatically ONLY once this page is opened through a real
  // published/shared URL (see the in-app note when that isn't the case).
  // The real, stable public address this app is hosted at. Once set, every
  // generated link uses this instead of whatever "location.href" happens to
  // be in the current tab (so links stay correct even while editing from a
  // local copy). Set to null to fall back to location.href automatically.
  const PUBLISHED_BASE_URL = 'https://charming-mochi-a5097c.netlify.app';

  function getBaseUrl(){
    // Hosted as its own website (GitHub Pages, Netlify, ...): links point to
    // wherever the page is actually being served from, so the same file
    // works on any host. Opened as a local file, or inside the Claude viewer
    // frame, fall back to the fixed published address.
    if (/^https?:$/.test(location.protocol) && window.self === window.top){
      return location.origin + location.pathname;
    }
    return PUBLISHED_BASE_URL || location.href.split('#')[0];
  }

  function buildSignLink(itemId){
    return getBaseUrl() + '#sign=' + encodeURIComponent(itemId);
  }

  // The link itself: since PUBLISHED_BASE_URL is set, every generated link
  // is always a real, sendable address — that problem is solved. What can
  // still vary is whether AUTO-fill-back works, which needs Claude's own
  // artifact storage (only present inside claude.ai) — a plain static host
  // like Netlify can serve the page perfectly but has no backend for that.
  // Either way the signer can always fall back to downloading a signature
  // image, so signing itself never breaks.
  function getHostingStatus(){
    if (hasArtifactStorage){
      return { ok:true, sync:true, label:'✅ الرابط صالح، والتوقيع سيصل تلقائيًا',
        detail:'هذا العنصر يعمل من داخل Claude، فسيمتلئ توقيع المدير هنا بنفسه بعد إرساله عبر الرابط.' };
    }
    return { ok:true, sync:false, label:'✅ الرابط صالح للإرسال',
      detail:'الرابط أعلاه ثابت ويعمل لأي شخص يفتحه. لكن الاستضافة الحالية (مثل Netlify) لا تدعم إعادة التوقيع تلقائيًا هنا — لذلك سيُنزَّل للموقّع صورة توقيعه تلقائيًا بعد التوقيع ليرسلها لك يدويًا، وهذا يعمل دائمًا بشكل مضمون.' };
  }

  function buildHostingHelpHtml(){
    const hs = getHostingStatus();
    const badgeColor = '#1a7a4c';
    return `
      <div style="background:#eafaf1;border:1px solid ${badgeColor}33;border-radius:10px;padding:8px 10px;margin-bottom:8px;">
        <div style="font-weight:bold;color:${badgeColor};font-size:12px;">${hs.label}</div>
        <div class="empty-hint" style="margin-top:3px;">${hs.detail}</div>

    `;
  }
  function parseRoute(){
    const m1 = location.hash.match(/sign=([^&]+)/);
    if (m1) return {type:'sign', id: decodeURIComponent(m1[1])};
    if (/follow=all/.test(location.hash)) return {type:'follow'};
    return null;
  }

  async function checkIncomingSignature(item, onDone, silent){
    const shared = await storGetShared('extsign:'+item.id);
    if (!shared){ if(!silent) toast('لا يوجد توقيع وارد بعد'); return; }
    const already = item.signature && item.signature.principalImg === shared.img;
    item.signature = item.signature || {};
    item.signature.principalName = shared.name || item.signature.principalName;
    item.signature.principalImg = shared.img || item.signature.principalImg;
    item.signature.date = shared.date || item.signature.date;
    saveItem(item.id, item);
    if (!already){ toast('تم استلام التوقيع ✅'); if (onDone) onDone(); }
  }

  // Read-only "follow-up" dashboard: anyone with this link can check the
  // status of every week/program at any time, without being able to edit

  function renderFollowUpDashboard(){

      <div class="card" style="text-align:center;border-top:4px solid var(--teal-700);">
        <div style="font-size:24px;">📊</div>
        <h2 style="justify-content:center;">متابعة خطة التوجيه الطلابي</h2>
        <div class="empty-hint">${escapeHtml(state.meta.school_name||'')} — عرض للاطلاع فقط</div>
      </div>
      <div class="card"><div class="overview-list">${rowsHtml}</div></div>
    `;
  }

  const route = parseRoute();
  if (route && route.type === 'sign'){
    renderExternalSignView(route.id);
  } else if (route && route.type === 'follow'){
    renderFollowUpDashboard();
  } else {
    init();
  }
})();
</script>
</body>
</html>
